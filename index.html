<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MGM FM | Hey Türkiye</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: linear-gradient(135deg, #e0f7fa, #ffffff);
      --bg-dark: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      --text-light: #1e1e1e;
      --text-dark: #f1f1f1;
      --card-light: #ffffffcc;
      --card-dark: #1c1f26cc;
      --accent: #4cd964;
      --radius: 20px;
      --shadow-light: 0 8px 30px rgba(0,0,0,0.1);
      --shadow-dark: 0 8px 30px rgba(255,255,255,0.06);
      --transition: 0.4s ease all;
    }

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  font-family: 'Montserrat', sans-serif;
  background: var(--bg-light);
  color: var(--text-light);
  transition: var(--transition);
  min-height: 100vh;
}

[data-theme="dark"] body {
  background: var(--bg-dark);
  color: var(--text-dark);
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 2rem 1rem;
}

h1 {
  text-align: center;
  margin-bottom: 2rem;
  font-size: 2.4rem;
  font-weight: 700;
}

.theme-toggle {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 999;
  display: flex;
  margin-bottom: 2rem;
}

.ios-switch {
  position: fixed;
  width: 60px;
  height: 34px;
}

.ios-switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #ccc;
  transition: .4s;
  border-radius: 34px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: .4s;
  border-radius: 50%;
}

input:checked + .slider {
  background-color: var(--accent);
}

input:checked + .slider:before {
  transform: translateX(26px);
}

.card {
  background: var(--card-light);
  border-radius: var(--radius);
  box-shadow: var(--shadow-light);
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  backdrop-filter: blur(10px);
  transition: var(--transition);
}

[data-theme="dark"] .card {
  background: var(--card-dark);
  box-shadow: var(--shadow-dark);
}

.card h2 {
  font-size: 1.2rem;
  margin-bottom: 0.8rem;
}

audio {
  width: 100%;
  border-radius: 8px;
}

footer {
  text-align: center;
  font-size: 0.9rem;
  margin-top: 3rem;
  opacity: 0.6;
}

#datetime {
  position: fixed;
  top: 20px;
  right: 20px;
  font-size: 0.95rem;
  background-color: rgba(255,255,255,0.7);
  color: #000;
  padding: 0.5rem 1rem;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  z-index: 9999;
}
[data-theme="dark"] #datetime {
  background-color: rgba(0,0,0,0.5);
  color: #fff;
}

  </style>
</head>
<body>
  <div id="datetime"></div>  <div class="container">
    <h1>MGM FM | Hey Türkiye</h1>
    <div class="theme-toggle">
    <label class="ios-switch">
    <input type="checkbox" id="toggleTheme">
    <span class="slider"></span>
  </label>
</div>
<br>
<br>

<div class="card">
  <h2>Bugün Hava Tahmini</h2>
  <audio controls src="https://mgm.gov.tr/Files/mp3/hava.mp3"></audio>
</div>

<div class="card">
  <h2>3 Günlük Hava Tahmini</h2>
  <audio controls src="https://mgm.gov.tr/Files/mp3/3Ghava.mp3"></audio>
</div>

<div class="card">
  <h2>Deniz Hava Durumu</h2>
  <audio controls src="https://mgm.gov.tr/Files/mp3/deniz.mp3"></audio>
</div>
  
<div class="card">
  <h2>3 Günlük Deniz Hava Durumu</h2>
  <audio controls src="https://mgm.gov.tr/Files/mp3/3Gdeniz.mp3"></audio>
</div>

<footer>
  © 2025 Hey Türkiye | Ses: © 2025 Meteoroloji Genel Müdürlüğü
</footer>
  </div>  
  <script>
    const toggle = document.getElementById('toggleTheme');
    const html = document.documentElement;
    const audios = document.querySelectorAll('audio');

    // Tema kontrolü
    toggle.addEventListener('change', () => {
      const mode = toggle.checked ? 'dark' : 'light';
      html.setAttribute('data-theme', mode);
      localStorage.setItem('theme', mode);
    });

    window.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('theme') || 'light';
      html.setAttribute('data-theme', saved);
      toggle.checked = saved === 'dark';
    });

    // Sadece bir MP3 çalsın
    audios.forEach(audio => {
      audio.addEventListener('play', () => {
        audios.forEach(other => {
          if (other !== audio && !other.paused) {
            audio.pause();
            alert('Açık mp3 varken başka mp3 çalamaz!');
          }
        });
      });
    });

    function updateDateTime() {
  const now = new Date();

  // UTC+3 için manuel düzeltme
  now.setHours(now.getHours());

  const days = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  const months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

  const dayName = days[now.getDay()];
  const date = now.getDate().toString().padStart(2, '0');
  const month = months[now.getMonth()];
  const year = now.getFullYear();
  const time = now.toTimeString().split(' ')[0];

  document.getElementById('datetime').innerHTML =
    `Bugün günlerden <strong>${date} ${month} ${year} ${dayName}</strong>, Saat: <strong>${time}'ı gösteriyor.</strong>`;
}

setInterval(updateDateTime, 1000);
updateDateTime();
  </script>
</body>
</html>
